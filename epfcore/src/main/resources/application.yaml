spring:
  application:
    name: mon-api-nexus
  profiles:
    active: dev

  # -------------------------------------------------------------------
  # CONFIGURATION COMMUNE (S'applique à Dev ET Prod)
  # -------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  config:
    import: optional:classpath:env.properties


recaptcha:
  secret: ${RECAPTCHA_SECRET}

storage:
  location: upload-dir

app:
  mail:
    from-name: "Admission EPF"





---
# -------------------------------------------------------------------
# CONFIGURATION DE DEVELOPPEMENT (LOCAL)
# -------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev

  datasource:

    url: jdbc:postgresql://db.jjcijtltmmabaqzkypdi.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: ${MDP_DATABASE_DEV}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: shinygamy12@gmail.com
    password: ${MDP_MAIL_DEV}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


# CORS local pour ton ng serve
app:
  cors:
    allowed-origins: "http://localhost:4200"

---
# -------------------------------------------------------------------
# CONFIGURATION DE PRODUCTION (MIGRATION)
# -------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://db.jjcijtltmmabaqzkypdi.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: ${MDP_DATABASE_PROD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: shinygamy12@gmail.com
    password: ${MDP_MAIL_PROD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: "https://ton-front-angular-migre.com"